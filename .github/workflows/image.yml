name: Build OS image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04            # pi-gen-action is proven here (DNS failed in docker build on 26.04)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Put the radio into the pi-gen stage
        run: |
          mkdir -p image/stage-alarmradio/00-install/files/alarm-radio
          cp -r bin systemd etc assets pi-setup.sh VERSION LICENSE image/stage-alarmradio/00-install/files/alarm-radio/
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Build image (Raspberry Pi OS Lite 32-bit + Pi Alarm Radio)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: pialarmradio-${{ env.VERSION }}
          pi-gen-version: master            # 32-bit (armhf): runs on the Pi Zero W too
          release: trixie
          stage-list: stage0 stage1 stage2 ./image/stage-alarmradio
          hostname: pialarmradio
          timezone: Europe/Tallinn
          locale: en_GB.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          wpa-country: EE
          password: ""                      # no default password: set the user in Raspberry Pi Imager
          enable-ssh: 0
          compression: xz
          verbose-output: true

      - name: Name the image and pack the installer
        run: |
          sudo cp "${{ steps.build.outputs.image-path }}" "pialarmradio-$VERSION.img.xz"   # pi-gen's output is root's
          sudo chown "$(id -u):$(id -g)" "pialarmradio-$VERSION.img.xz"
          d="pialarmradio-$VERSION-installer"
          mkdir "$d" && cp -r bin systemd etc assets pi-setup.sh install.sh VERSION LICENSE README.md CHANGELOG.md "$d"/
          rm -rf "$d"/bin/__pycache__
          tar czf "$d.tar.gz" "$d"

      - name: Release notes from CHANGELOG.md
        run: awk -v v="$VERSION" '$0 ~ "^## " {p = index($0, v) > 0; next} p' CHANGELOG.md > release-notes.md

      - name: Attach image to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pi Alarm Radio ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}   # e.g. v1.0.0-beta.1
          files: |
            pialarmradio-${{ env.VERSION }}.img.xz
            pialarmradio-${{ env.VERSION }}-installer.tar.gz

      - name: Keep image as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pialarmradio-${{ env.VERSION }}
          path: |
            pialarmradio-${{ env.VERSION }}.img.xz
            pialarmradio-${{ env.VERSION }}-installer.tar.gz
          retention-days: 14
