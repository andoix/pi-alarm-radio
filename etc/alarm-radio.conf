# /etc/alarm-radio.conf — all alarm radio settings live here.
# After editing, run:  sudo radio-apply   (regenerates the timer, restarts services)
# Shell syntax: NAME=value, no spaces around "=". Quote values with spaces.

# --- Alarm schedule ---------------------------------------------------------
ALARM_ENABLED=yes              # yes | no
ALARM_TIME=07:00               # HH:MM, 24h
ALARM_DAYS=Mon..Fri            # systemd day spec: Mon..Fri | Sat,Sun | Mon,Wed,Fri | "*" (every day)
TIMEZONE=Europe/Tallinn

# --- What to play -----------------------------------------------------------
STREAM_URL=http://icecast.err.ee/vikerraadio.mp3
VOLUME=60                      # 0-100, mpv volume (cubic/perceptual scale)
DURATION_MIN=60                # how long the alarm plays
FADE_SEC=45                    # fade-in from silence to VOLUME
TEST_DURATION_MIN=2            # length of "radio test-alarm"

# Wake-up light (the speaker bulb): fades in dark -> red -> orange -> LIGHT_COLOR together with the volume (FADE_SEC)
LIGHT_ENABLED=no               # yes | no
LIGHT_COLOR=ffb060             # final colour RRGGBB (ffb060 = warm white mix)
LIGHT_BRIGHT=100               # final brightness 1-100 %

# Played (looped) if the stream can't be reached, so the alarm always sounds.
FALLBACK_SOUND=/usr/local/share/alarm-radio/fallback.wav

# --- Speaker ----------------------------------------------------------------
SPEAKER_NAME=""                # set by radio-pair / the web UI (Speaker → Use)
SPEAKER_MAC=                   # set by radio-pair / the web UI

# Keep-alive tone while idle: stops speakers from auto-powering-off, keeps the Bluetooth link active
KEEPALIVE_ENABLED=yes
KEEPALIVE_FREQ=20              # Hz
KEEPALIVE_GAIN=-49             # dBFS

# --- Light (only when the speaker is an RGB speaker bulb, see README) ---
BULB_MAC=                      # set automatically when the speaker is an RGB speaker bulb
